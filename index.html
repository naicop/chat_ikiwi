<script>
  var chatReady = false;

  function setupChatwootUser() {
    if (chatReady || !window.$chatwoot) return;
    chatReady = true;

    try {
      const urlParams = new URLSearchParams(window.location.search);
      const nombre = urlParams.get('nombre');
      let phone = urlParams.get('phone');
      const email = urlParams.get('email');

      if (phone) {
        phone = phone.trim();
        if (!phone.startsWith('+')) {
          phone = '+' + phone.replace(/\D/g, '');
        }
      }

      const identifier = phone || email || 'anon_' + Math.random().toString(36).substring(2, 9);
      const userAttributes = { name: nombre || "Usuario de WhatsApp" };
      if (email) userAttributes.email = email;
      if (phone) userAttributes.phone_number = phone;

      window.$chatwoot.setUser(identifier, userAttributes);
    } catch (e) {
      console.error('Error en setUser:', e);
    }

    try {
      window.$chatwoot.setCustomAttributes({ origen: 'WhatsApp Migration' });
    } catch (e) {
      console.error('Error en setCustomAttributes (¿existe el atributo "origen" en Ajustes > Atributos personalizados > Contacto?):', e);
    }

    // Actualizamos la tarjeta ANTES del toggle, así el usuario ve confirmación
    // aunque el toggle falle por algún motivo.
    document.getElementById('loader').style.display = 'none';
    document.getElementById('title').innerText = "¡Chat listo!";
    document.getElementById('description').innerText = "Puedes chatear con nosotros desde el widget en la esquina inferior derecha.";

    try {
      window.$chatwoot.toggle('open');
    } catch (e) {
      console.error('Error al abrir el widget:', e);
    }
  }

  window.addEventListener("chatwoot:ready", setupChatwootUser);

  var checkInterval = setInterval(function () {
    if (window.$chatwoot && typeof window.$chatwoot.setUser === 'function') {
      clearInterval(checkInterval);
      setupChatwootUser();
    }
  }, 300);

  // Si a los 8 segundos nada cargó, avisamos que algo falló en vez de spinnear para siempre
  setTimeout(function () {
    if (!chatReady) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('title').innerText = "No pudimos cargar el chat";
      document.getElementById('description').innerText = "Por favor recargá la página o contactanos por otro medio.";
      console.error('El SDK de Chatwoot nunca emitió chatwoot:ready ni expuso window.$chatwoot. Revisá que chatwoot.ikiwi.net.ar/packs/js/sdk.js cargue sin errores de red/CORS.');
    }
  }, 8000);
</script>
