<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención al Cliente - iKiwi Argentina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #006644;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #1e293b; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.5; }

  </style>

  <!-- Script SDK de Chatwoot -->
 <script>
  window.chatwootSettings = {"position":"right","type":"standard","launcherTitle":""};
  (function(d,t) {
    var BASE_URL="https://chatwoot.ikiwi.net.ar";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: 'vUPWMKNzDMuT8qBUUQVogKee',
        baseUrl: BASE_URL
      })
    }
  })(document,"script");
</script>

</head>
<body>

  <div class="card">
    <div id="loader" class="spinner"></div>
    <h1 id="title">Iniciando chat de atención...</h1>
    <p id="description">Estamos conectando tu conversación. Si el chat no se abre automáticamente, presiona el botón en la esquina inferior derecha.</p>
  </div>

 <script>
  var chatReady = false;

  function setLoaderState(hidden, title, desc) {
    var loaderEl = document.getElementById('loader');
    var titleEl = document.getElementById('title');
    var descEl = document.getElementById('description');

    if (loaderEl) loaderEl.style.display = hidden ? 'none' : '';
    if (titleEl) titleEl.innerText = title;
    if (descEl) descEl.innerText = desc;

    if (!loaderEl || !titleEl || !descEl) {
      console.error('No se encontraron uno o más elementos (#loader, #title, #description). Verificá que el HTML no esté siendo modificado por el servidor/CMS.');
    }
  }

  function setupChatwootUser() {
    if (chatReady || !window.$chatwoot) return;
    chatReady = true;

    try {
      const urlParams = new URLSearchParams(window.location.search);
      const nombre = urlParams.get('nombre');
      let phone = urlParams.get('phone');
      const email = urlParams.get('email');

      if (phone) {
        phone = phone.trim();
        if (!phone.startsWith('+')) {
          phone = '+' + phone.replace(/\D/g, '');
        }
      }

      const identifier = phone || email || 'anon_' + Math.random().toString(36).substring(2, 9);
      const userAttributes = { name: nombre || "Usuario de WhatsApp" };
      if (email) userAttributes.email = email;
      if (phone) userAttributes.phone_number = phone;

      window.$chatwoot.setUser(identifier, userAttributes);
    } catch (e) {
      console.error('Error en setUser:', e);
    }

    try {
      window.$chatwoot.setCustomAttributes({ origen: 'WhatsApp Migration' });
    } catch (e) {
      console.error('Error en setCustomAttributes (¿existe "origen" en Ajustes > Atributos personalizados > Contacto?):', e);
    }

    setLoaderState(true, "¡Chat listo!", "Puedes chatear con nosotros desde el widget en la esquina inferior derecha.");

    try {
      window.$chatwoot.toggle('open');
    } catch (e) {
      console.error('Error al abrir el widget:', e);
    }
  }

  function init() {
    window.addEventListener("chatwoot:ready", setupChatwootUser);

    var checkInterval = setInterval(function () {
      if (window.$chatwoot && typeof window.$chatwoot.setUser === 'function') {
        clearInterval(checkInterval);
        setupChatwootUser();
      }
    }, 300);

    setTimeout(function () {
      if (!chatReady) {
        setLoaderState(true, "No pudimos cargar el chat", "Por favor recargá la página o contactanos por otro medio.");
        console.error('El SDK de Chatwoot nunca emitió chatwoot:ready ni expuso window.$chatwoot.');
      }
    }, 8000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

   window.addEventListener("chatwoot:ready", function () {
  const urlParams = new URLSearchParams(window.location.search);
  const nombre = urlParams.get('nombre');
  let phone = urlParams.get('phone');
  const email = urlParams.get('email');

  if (phone) {
    phone = phone.trim();
    if (!phone.startsWith('+')) phone = '+' + phone.replace(/\D/g, '');
  }

  const identifier = phone || email || 'anon_' + Math.random().toString(36).substring(2, 9);
  const userAttributes = { name: nombre || "Usuario WhatsApp" };
  if (email) userAttributes.email = email;
  if (phone) userAttributes.phone_number = phone;

  window.$chatwoot.setUser(identifier, userAttributes);

  window.$chatwoot.setCustomAttributes({
    origen: 'WhatsApp Migration'
  });

  // Ocultar la tarjeta base y desplegar la ventana de conversación completa
  document.getElementById('card').style.display = 'none';
  window.$chatwoot.toggle('open');
});

  
  function openDirectChat() {
    if (!window.$chatwoot) return;

    // 1. Ocultar la burbuja flotante verde para que no tape el input de texto en mobile
    if (window.$chatwoot.hideMessage) {
      window.$chatwoot.hideMessage();
    }

    // 2. Forzar salto directo a la ventana de chat activa (sin pasar por la home del widget)
    if (typeof window.$chatwoot.popout === 'function') {
      window.$chatwoot.toggle('open');
    } else {
      window.$chatwoot.toggle('open');
    }
  }

  window.addEventListener("chatwoot:ready", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const nombre = urlParams.get('nombre');
    let phone = urlParams.get('phone');
    const email = urlParams.get('email');

    if (phone) {
      phone = phone.trim();
      if (!phone.startsWith('+')) phone = '+' + phone.replace(/\D/g, '');
    }

    const identifier = phone || email || 'anon_' + Math.random().toString(36).substring(2, 9);
    const userAttributes = { name: nombre || "Usuario WhatsApp" };
    if (email) userAttributes.email = email;
    if (phone) userAttributes.phone_number = phone;

    // Seteamos los datos del usuario
    window.$chatwoot.setUser(identifier, userAttributes);
    window.$chatwoot.setCustomAttributes({ origen: 'WhatsApp Migration' });

    // Cambiar la tarjeta de fondo por si el usuario cierra la ventana del chat
    document.getElementById('card-title').innerText = "¡Atención iKiwi Argentina!";
    document.getElementById('card-desc').innerText = "Si cerraste la ventana de chat, puedes volver a abrirla presionando el botón de abajo.";
    document.getElementById('reopen-btn').style.display = 'block';

    // Abrir el chat directamente
    openDirectChat();
  });

</script>
</body>
</html>
