<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atención al Cliente - iKiwi Argentina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #006644;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-reopen {
      margin-top: 1.5rem;
      background-color: #006644;
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-reopen:hover { background-color: #004d33; }

    /* --- REGLAS CSS PARA ELIMINAR LA BURBUJA NATIVA Y SUS DESPLAZAMIENTOS --- */
    .woot-widget-bubble,
    .cw-widget-holder .woot-widget-bubble,
    .woot--bubble-holder,
    iframe[name="chatwoot_live_chat_widget"] + button {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>

  <!-- Script SDK de Chatwoot -->
  <script>
    window.chatwootSettings = { "position": "right", "type": "standard", "launcherTitle": "" };
    (function(d,t) {
      var BASE_URL = "https://chatwoot.ikiwi.net.ar";
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/packs/js/sdk.js";
      g.async = true;
      s.parentNode.insertBefore(g,s);
      g.onload = function(){
        window.chatwootSDK.run({
          websiteToken: 'vUPWMKNzDMuT8qBUUQVogKee',
          baseUrl: BASE_URL
        });
      }
    })(document,"script");
  </script>
</head>
<body>

  <div class="card" id="main-card">
    <div class="spinner" id="loader"></div>
    <h2 id="card-title">Iniciando atención...</h2>
    <p id="card-desc" style="color: #64748b; margin-top: 0.5rem; font-size: 0.95rem;">
      Conectando con tu chat de iKiwi...
    </p>
    
    <button id="reopen-btn" class="btn-reopen" style="display: none;" onclick="openChat()">
      Abrir chat de atención
    </button>
  </div>

 <script>
  var chatReady = false;

  function openChat() {
    if (window.$chatwoot) {
      window.$chatwoot.toggle('open');
    }
  }

  function setCardState(loaderHidden, title, desc, showButton) {
    var loaderEl = document.getElementById('loader');
    var titleEl = document.getElementById('card-title');
    var descEl = document.getElementById('card-desc');
    var btnEl = document.getElementById('reopen-btn');

    if (loaderEl) loaderEl.style.display = loaderHidden ? 'none' : '';
    if (titleEl) titleEl.innerText = title;
    if (descEl) descEl.innerText = desc;
    if (btnEl) btnEl.style.display = showButton ? 'block' : 'none';
  }

  function setupChatwootUser() {
    if (chatReady || !window.$chatwoot) return;
    chatReady = true;

    // Pequeña pausa para asegurar que el iframe del SDK esté listo para recibir datos
    setTimeout(function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Decodificamos de forma segura los parámetros URL
        const nombre = urlParams.get('nombre') ? decodeURIComponent(urlParams.get('nombre')) : null;
        const email = urlParams.get('email') ? decodeURIComponent(urlParams.get('email')) : null;
        let phone = urlParams.get('phone') ? decodeURIComponent(urlParams.get('phone')) : null;

        if (phone) {
          phone = phone.trim();
          if (!phone.startsWith('+')) {
            phone = '+' + phone.replace(/\D/g, '');
          }
        }

        // Identifier único para la sesión
        const identifier = phone || email || 'anon_' + Math.random().toString(36).substring(2, 9);
        
        const userAttributes = { 
          name: nombre || "Usuario de WhatsApp" 
        };
        if (email) userAttributes.email = email;
        if (phone) userAttributes.phone_number = phone;

        // 1. Seteamos la identidad del usuario
        window.$chatwoot.setUser(identifier, userAttributes);

        // 2. Seteamos atributos personalizados
        const utmSource = urlParams.get('utm_source') || 'WhatsApp Migration';
        window.$chatwoot.setCustomAttributes({ origen: utmSource });

      } catch (e) {
        console.error('Error al configurar usuario en Chatwoot:', e);
      }

      // Actualizar tarjeta de fondo
      setCardState(
        true, 
        "¡Atención iKiwi Argentina!", 
        "Si cerraste la ventana de chat, puedes volver a abrirla presionando el botón de abajo.", 
        true
      );

      // 3. Abrir la ventana de chat
      try {
        window.$chatwoot.toggle('open');
      } catch (e) {
        console.error('Error al abrir el widget:', e);
      }
    }, 250);
  }

  function init() {
    // Escuchar el evento nativo que emite el SDK cuando está listo
    window.addEventListener("chatwoot:ready", setupChatwootUser);

    // Timeout de respaldo por si el SDK tarda más de lo esperado
    setTimeout(function () {
      if (!chatReady) {
        if (window.$chatwoot && typeof window.$chatwoot.setUser === 'function') {
          setupChatwootUser();
        } else {
          setCardState(
            true, 
            "No pudimos cargar el chat", 
            "Por favor recargá la página o contactanos por otro medio.", 
            false
          );
          console.error('El SDK de Chatwoot no respondió a tiempo.');
        }
      }
    }, 5000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
