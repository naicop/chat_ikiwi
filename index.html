<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Chatwoot</title>
</head>
<body style="font-family: sans-serif; padding: 2rem;">

  <h2>Diagnóstico de Chatwoot</h2>
  <div id="status" style="padding: 1rem; background: #eee; border-radius: 8px;">Cargando script...</div>

  <script>
    function log(msg) {
      document.getElementById('status').innerHTML += '<br>• ' + msg;
      console.log(msg);
    }

    (function(d,t) {
      var BASE_URL = "https://chatwoot.ikiwi.net.ar";
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/js/sdk.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g,s);

      g.onload = function(){
        log("Archivo /js/sdk.js descargado con éxito.");
        
        try {
          window.chatwootSDK.run({
            websiteToken: 'vUPWMKNzDMuT8qBUUQVogKee',
            baseUrl: BASE_URL
          });
          log("chatwootSDK.run() ejecutado.");
        } catch(e) {
          log("Error al ejecutar run(): " + e.message);
        }
      }

      g.onerror = function() {
        log("ERROR: No se pudo descargar https://chatwoot.ikiwi.net.ar/js/sdk.js (Posible bloqueo de red/AdBlock o SSL)");
      }
    })(document,'script');

    window.addEventListener("chatwoot:ready", function () {
      log("¡Evento chatwoot:ready recibido! window.$chatwoot ya está listo.");
      window.$chatwoot.toggle('open');
    });
  </script>

</body>
</html>
